[tools]
go = "1.26"
python = "3.14"
node = "24"
kubectl = "latest"
helm = "latest"
kind = "latest"
kustomize = "latest"
buf = "latest"
sqlc = "latest"
"aqua:pressly/goose" = "latest"
golangci-lint = "latest"
lefthook = "latest"

[env]
KIND_CLUSTER_NAME = "optimus"
OLLAYA_HOST = "127.0.0.1:11435"
KUBECONFIG = "{{config_root}}/.kube/kind-optimus.yaml"

[tasks.setup]
description = "One-shot master bootstrap: creates cluster, builds images, deploys stack, runs migrations, seeds fixtures"
run = "./scripts/setup.sh"

[tasks.bootstrap]
run = """
  for p in platform decision-service integration-mocks operator; do
    (cd projects/$p && go mod download) || true
  done
  (cd e2e && go mod download) || true
  if [ -d "projects/ai-runtime" ]; then
    (cd projects/ai-runtime && uv sync) || true
  fi
  lefthook install || true
"""

[tasks.kind-create]
description = "Create local Kind cluster with registry mirror"
run = "./scripts/kind-create.sh"

[tasks.kind-destroy]
description = "Destroy local Kind cluster and registry"
run = "./scripts/kind-destroy.sh"

[tasks."ingress:up"]
description = "Setup Kind ingress with TLS certificates and ingress-nginx"
run = "./scripts/setup-kind-ingress.sh up"

[tasks."ingress:all"]
description = "Create TLS Ingresses for all deployed Optimus services"
run = "./scripts/setup-kind-ingress.sh ingress-all"

[tasks."ingress:dns"]
description = "Setup dnsmasq wildcard DNS for *.optimus.local"
run = "./scripts/setup-kind-ingress.sh dns"

[tasks."ingress:certs"]
description = "Issue or renew the *.optimus.local wildcard certificate and sync it into the cluster"
run = "./scripts/setup-kind-ingress.sh certs"

[tasks."ingress:certs-force"]
description = "Force-regenerate the wildcard certificate (drops the existing key pair)"
run = "./scripts/setup-kind-ingress.sh certs --force"

[tasks."ingress:verify"]
description = "Verify DNS resolution and TLS Ingress endpoints"
run = "./scripts/setup-kind-ingress.sh verify"

[tasks."ingress:down"]
description = "Teardown Kind ingress and cluster"
run = "./scripts/setup-kind-ingress.sh down"

[tasks.build]
description = "Build all container images and push to local registry"
run = "./scripts/build.sh"

[tasks.deploy]
description = "Deploy base infrastructure and services via Kustomize (defaults to kind-dev)"
run = "./scripts/deploy.sh kind-dev"

[tasks."deploy:dev"]
description = "Deploy to local Kind cluster using kind-dev overlay"
run = "./scripts/deploy.sh kind-dev"

[tasks."deploy:ci"]
description = "Deploy to CI Kind cluster using kind-ci overlay"
run = "./scripts/deploy.sh kind-ci"
[tasks.migrate]
description = "Apply database schema migrations to PostgreSQL"
run = "./scripts/migrate.sh"

[tasks.seed]
description = "Seed operational fixtures (tenants, assets, documents) into PostgreSQL"
run = "./scripts/seed.sh"

[tasks.crds-install]
description = "Install Kubernetes Operator CRDs"
run = "kubectl apply -k projects/operator/config/crd"
[tasks.test]
description = "Run fast tests across all projects (including architecture fitness tests)"
run = """
  for p in platform decision-service integration-mocks operator; do
    echo "==> Testing projects/$p..."
    (cd projects/$p && go test -race -v ./...) || exit 1
  done
  if [ -d "projects/ai-runtime" ]; then
    echo "==> Testing projects/ai-runtime..."
    (cd projects/ai-runtime && uv run pytest -v) || exit 1
  fi
"""

[tasks."test:arch"]
description = "Run architecture boundary tests across Go and Python runtimes"
run = """
  echo "==> Running Architecture Fitness Tests..."
  (cd projects/platform && go test -v ./test/arch/...) || exit 1
  (cd projects/operator && go test -v ./test/arch/...) || exit 1
  if [ -d "projects/ai-runtime" ]; then
    (cd projects/ai-runtime && uv run pytest tests/test_architecture.py) || exit 1
  fi
  echo "✅ All architectural boundary invariants passed."
"""

[tasks."test:mutation"]
description = "Run targeted mutation tests on core decision and agent logic"
run = "./scripts/test-mutation.sh"

[tasks.lint]
description = "Run linters across all projects"
run = """
  for p in platform decision-service integration-mocks operator; do
    echo "==> Linting projects/$p..."
    (cd projects/$p && golangci-lint run ./...) || exit 1
  done
  if [ -d "projects/ai-runtime" ]; then
    echo "==> Linting projects/ai-runtime..."
    (cd projects/ai-runtime && uv run ruff check . && uv run mypy .) || exit 1
  fi
"""

[tasks.e2e]
description = "Run full Kind E2E scenarios"
run = "cd e2e && go test -v -tags=e2e ./scenarios/... -timeout 20m"

[tasks."e2e:live"]
description = "Run E2E test against live cluster using port-forwards"
run = "./scripts/test-e2e-live.sh"
[tasks.demo]
description = "Run the interactive live cluster demo against real endpoints"
run = "./scripts/demo.sh"

[tasks."demo:mock"]
description = "Run the offline simulation demo (no cluster needed)"
run = "./scripts/demo-mock.sh"
[tasks.clean]
description = "Cleanup local dev environment"
run = "./scripts/cleanup.sh"
