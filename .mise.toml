[tools]
go = "1.26"
python = "3.14"
node = "24"
kubectl = "latest"
helm = "latest"
kind = "latest"
kustomize = "latest"
buf = "latest"
sqlc = "latest"
goose = "latest"
golangci-lint = "latest"
lefthook = "latest"

[env]
COMPOSE_PROJECT_NAME = "optimus"
KIND_CLUSTER_NAME = "optimus"
OLLAYA_HOST = "127.0.0.1:11435"
KUBECONFIG = "{{config_root}}/.kube/kind-optimus.yaml"

[tasks.bootstrap]
description = "One-shot: install dependencies for all sub-projects"
run = """
  for p in platform decision-service integration-mocks operator; do
    (cd projects/$p && go mod download) || true
  done
  (cd e2e && go mod download) || true
  if [ -d "projects/ai-runtime" ]; then
    (cd projects/ai-runtime && uv sync) || true
  fi
  lefthook install || true
"""

[tasks.kind-create]
description = "Create local Kind cluster with registry mirror"
run = "./scripts/kind-create.sh"

[tasks.kind-destroy]
description = "Destroy local Kind cluster and registry"
run = "./scripts/kind-destroy.sh"

[tasks.build]
description = "Build all container images and push to local registry"
run = "./scripts/build.sh"

[tasks.deploy]
description = "Deploy base infrastructure and services via Kustomize"
run = "./scripts/deploy.sh"

[tasks.crds-install]
description = "Install Kubernetes Operator CRDs"
run = "kubectl apply -k projects/operator/config/crd"

[tasks.test]
description = "Run fast tests across all projects (no Kind required)"
run = """
  for p in platform decision-service integration-mocks operator; do
    echo "==> Testing projects/$p..."
    (cd projects/$p && go test -race -v ./...) || exit 1
  done
  if [ -d "projects/ai-runtime" ]; then
    echo "==> Testing projects/ai-runtime..."
    (cd projects/ai-runtime && uv run pytest -v) || exit 1
  fi
"""

[tasks.lint]
description = "Run linters across all projects"
run = """
  for p in platform decision-service integration-mocks operator; do
    echo "==> Linting projects/$p..."
    (cd projects/$p && golangci-lint run ./...) || exit 1
  done
  if [ -d "projects/ai-runtime" ]; then
    echo "==> Linting projects/ai-runtime..."
    (cd projects/ai-runtime && uv run ruff check . && uv run mypy .) || exit 1
  fi
"""

[tasks.e2e]
description = "Run full Kind E2E scenarios"
run = "cd e2e && go test -v -tags=e2e ./scenarios/... -timeout 20m"

[tasks.demo]
description = "Run the interactive maintenance CLI demo"
run = "./scripts/demo.sh"

[tasks.clean]
description = "Cleanup local dev environment"
run = "./scripts/cleanup.sh"
