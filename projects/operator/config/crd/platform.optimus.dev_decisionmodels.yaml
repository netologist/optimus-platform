apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: decisionmodels.platform.optimus.dev
spec:
  group: platform.optimus.dev
  names:
    kind: DecisionModel
    listKind: DecisionModelList
    plural: decisionmodels
    singular: decisionmodel
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [ollayaRef, model]
              properties:
                ollayaRef:
                  type: object
                  required: [service, port]
                  properties:
                    service:
                      type: string
                    port:
                      type: integer
                model:
                  type: string
                keepAlive:
                  type: string
                precision:
                  type: string
                questionSetRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                pulledDigest:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
