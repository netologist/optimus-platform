apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: enterpriseenvironments.platform.optimus.dev
spec:
  group: platform.optimus.dev
  names:
    kind: EnterpriseEnvironment
    listKind: EnterpriseEnvironmentList
    plural: enterpriseenvironments
    singular: enterpriseenvironment
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant, systems, decisionModelRef]
              properties:
                tenant:
                  type: string
                systems:
                  type: array
                  items:
                    type: string
                decisionModelRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                ai:
                  type: object
                  properties:
                    rag:
                      type: boolean
                    mcp:
                      type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                integrationsReady:
                  type: integer
                totalIntegrations:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
