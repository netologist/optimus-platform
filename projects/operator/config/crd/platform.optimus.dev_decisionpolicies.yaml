apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: decisionpolicies.platform.optimus.dev
spec:
  group: platform.optimus.dev
  names:
    kind: DecisionPolicy
    listKind: DecisionPolicyList
    plural: decisionpolicies
    singular: decisionpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant, version, rules]
              properties:
                tenant:
                  type: string
                version:
                  type: string
                description:
                  type: string
                rules:
                  type: object
                  properties:
                    approvalTriggers:
                      type: object
                      properties:
                        safetyRiskIn:
                          type: array
                          items:
                            type: string
                        severityThreshold:
                          type: number
                        minConfidenceThreshold:
                          type: number
                    financialLimits:
                      type: object
                      properties:
                        maxAutoDispatchCostUSD:
                          type: number
                        requireApprovalIfPartUnobtainable:
                          type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenant
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
