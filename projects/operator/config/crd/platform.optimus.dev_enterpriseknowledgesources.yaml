apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: enterpriseknowledgesources.platform.optimus.dev
spec:
  group: platform.optimus.dev
  names:
    kind: EnterpriseKnowledgeSource
    listKind: EnterpriseKnowledgeSourceList
    plural: enterpriseknowledgesources
    singular: enterpriseknowledgesource
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenantRef, sourceType, endpoint]
              properties:
                tenantRef:
                  type: string
                sourceType:
                  type: string
                  enum: [s3, sharepoint, teamcenter, smb]
                endpoint:
                  type: string
                credentialsSecretRef:
                  type: object
                  properties:
                    name:
                      type: string
                indexing:
                  type: object
                  properties:
                    chunkSize:
                      type: integer
                    chunkOverlap:
                      type: integer
                    embeddingModel:
                      type: string
                    collection:
                      type: string
                syncSchedule:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                documentsIndexed:
                  type: integer
                lastSyncTime:
                  type: string
                vectorDimensions:
                  type: integer
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
      additionalPrinterColumns:
        - name: Tenant
          type: string
          jsonPath: .spec.tenantRef
        - name: Source
          type: string
          jsonPath: .spec.sourceType
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Indexed
          type: integer
          jsonPath: .status.documentsIndexed
