apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: enterpriseintegrations.platform.optimus.dev
spec:
  group: platform.optimus.dev
  names:
    kind: EnterpriseIntegration
    listKind: EnterpriseIntegrationList
    plural: enterpriseintegrations
    singular: enterpriseintegration
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tenant, systemType, port]
              properties:
                tenant:
                  type: string
                systemType:
                  type: string
                port:
                  type: integer
                capabilities:
                  type: array
                  items:
                    type: string
                secretRef:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                endpoint:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
