services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: optimus-postgres
    environment:
      POSTGRES_USER: optimus
      POSTGRES_PASSWORD: optimus_secret
      POSTGRES_DB: optimus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimus -d optimus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.14
    container_name: optimus-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://127.0.0.1:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: optimus-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=optimus
      - POSTGRES_PWD=optimus_secret
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.30.0
    container_name: optimus-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8233
    ports:
      # The UI server listens on 8080 inside the container; 8233 is kept as the host port
      # so the documented localhost:8233 URL (and the CORS origin below) still hold.
      - "8233:8080"

  kong:
    image: kong:3.8.0
    container_name: optimus-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./deployments/base/kong/kong.yaml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"

  ollaya:
    image: ollaya/ollaya:latest
    container_name: optimus-ollaya
    environment:
      - OLLAYA_HOST=0.0.0.0:11435
    ports:
      - "11435:11435"

  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    container_name: optimus-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: optimus-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: optimus-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    ports:
      - "5601:5601"
