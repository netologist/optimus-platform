version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    paths:
      - vendor
      - bin

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor
      - bin
