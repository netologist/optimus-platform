apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optimus

resources:
  # Infrastructure Dependencies
  - ../../base/postgres
  - ../../base/redpanda
  - ../../base/temporal
  - ../../base/kong
  - ../../base/ollaya
  - ../../base/observability

  # Application Services
  - ../../base/platform
  - ../../base/decision-service
  - ../../base/integration-mocks
  - ../../base/ai-runtime
  - ../../base/operator

# CI Image overrides targeting GitHub Container Registry (ghcr.io)
# The CI pipeline uses `kustomize edit set image` to inject the commit SHA tag for built services
images:
  - name: localhost:5001/optimus/platform:dev
    newName: ghcr.io/netologist/optimus-platform-platform
    newTag: latest
  - name: localhost:5001/optimus/decision-service:dev
    newName: ghcr.io/netologist/optimus-platform-decision-service
    newTag: latest
  - name: localhost:5001/optimus/integration-mocks:dev
    newName: ghcr.io/netologist/optimus-platform-integration-mocks
    newTag: latest
  - name: localhost:5001/optimus/ai-runtime:dev
    newName: ghcr.io/netologist/optimus-platform-ai-runtime
    newTag: latest
  - name: localhost:5001/optimus/operator:dev
    newName: ghcr.io/netologist/optimus-platform-operator
    newTag: latest
  - name: localhost:5001/ollaya-dev/ollaya:latest
    newName: ghcr.io/netologist/optimus-platform-ollaya
    newTag: latest
