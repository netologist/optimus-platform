apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: optimus

resources:
  # Infrastructure Dependencies
  - ../../base/postgres
  - ../../base/redpanda
  - ../../base/temporal
  - ../../base/kong
  - ../../base/ollaya
  - ../../base/observability
  # Local-dev-only UIs (Prometheus, Grafana, Elasticsearch, Kibana). Intentionally absent
  # from kind-ci — nothing in CI or the E2E suite consumes them.
  - observability-local

  # Application Services
  - ../../base/platform
  - ../../base/decision-service
  - ../../base/integration-mocks
  - ../../base/ai-runtime
  - ../../base/operator
