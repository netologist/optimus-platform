apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: optimus
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: platform-api
        url: http://platform.optimus.svc:8080
        routes:
          - name: platform-v1-routes
            paths:
              - /v1/
            strip_path: false
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: optimus
  labels:
    app.kubernetes.io/name: kong
spec:
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: admin
      port: 8001
      targetPort: 8001
  selector:
    app.kubernetes.io/name: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: optimus
  labels:
    app.kubernetes.io/name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kong
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kong
    spec:
      containers:
        - name: kong
          image: kong:3.8.0
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: "/etc/kong/kong.yml"
            - name: KONG_PROXY_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_ADMIN_ACCESS_LOG
              value: "/dev/stdout"
            - name: KONG_PROXY_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_ERROR_LOG
              value: "/dev/stderr"
            - name: KONG_ADMIN_LISTEN
              value: "0.0.0.0:8001"
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
      volumes:
        - name: kong-config
          configMap:
            name: kong-declarative-config
