apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: optimus
  labels:
    app.kubernetes.io/name: redpanda
spec:
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    # Second listener advertised as localhost, so a client reaching Redpanda through
    # `kubectl port-forward` (the live E2E suite, a locally run relay) receives metadata
    # it can actually connect back to instead of the in-cluster service DNS name.
    - name: kafka-external
      port: 19092
      targetPort: 19092
    - name: admin
      port: 9644
      targetPort: 9644
    - name: schema-registry
      port: 8081
      targetPort: 8081
  selector:
    app.kubernetes.io/name: redpanda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: optimus
  labels:
    app.kubernetes.io/name: redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redpanda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.14
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp=1
            - --memory=512M
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
            - --advertise-kafka-addr=INTERNAL://redpanda.optimus.svc:9092,EXTERNAL://localhost:19092
          ports:
            - containerPort: 9092
              name: kafka
            - containerPort: 19092
              name: kafka-external
            - containerPort: 9644
              name: admin
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 5
            periodSeconds: 5
