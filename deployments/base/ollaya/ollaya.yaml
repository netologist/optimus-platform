apiVersion: v1
kind: Service
metadata:
  name: ollaya
  namespace: optimus
  labels:
    app.kubernetes.io/name: ollaya
spec:
  ports:
    - name: http
      port: 11435
      targetPort: 11435
  selector:
    app.kubernetes.io/name: ollaya
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollaya
  namespace: optimus
  labels:
    app.kubernetes.io/name: ollaya
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollaya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollaya
    spec:
      containers:
        - name: ollaya
          image: ollaya/ollaya:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAYA_HOST
              value: "0.0.0.0:11435"
          ports:
            - containerPort: 11435
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 11435
            initialDelaySeconds: 3
            periodSeconds: 5
