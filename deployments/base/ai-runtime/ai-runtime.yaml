# Minimal deployment manifest for AI Runtime
# TODO: In production, configure GPU nodeSelector, tolerations, and pre-downloaded HuggingFace cache volume
apiVersion: v1
kind: Service
metadata:
  name: ai-runtime
  namespace: optimus
  labels:
    app.kubernetes.io/name: ai-runtime
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/name: ai-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-runtime
  namespace: optimus
  labels:
    app.kubernetes.io/name: ai-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-runtime
    spec:
      containers:
        - name: ai-runtime
          image: localhost:5001/optimus/ai-runtime:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PLATFORM_BASE_URL
              value: "http://platform.optimus.svc:8080"
            - name: LLM_PROVIDER
              value: "mock"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
