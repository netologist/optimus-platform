apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: optimus
  labels:
    app.kubernetes.io/name: temporal
spec:
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
    - name: ui
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: temporal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: optimus
  labels:
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal
    spec:
      containers:
        - name: temporal-server
          image: temporalio/auto-setup:1.24.2
          ports:
            - containerPort: 7233
              name: grpc
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: "optimus"
            - name: POSTGRES_PWD
              value: "optimus_secret"
            - name: POSTGRES_SEEDS
              value: "postgres.optimus.svc"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
        - name: temporal-ui
          image: temporalio/ui:2.30.0
          ports:
            # The UI server binds 8080 on its own; declaring 8233 here (and on the
            # Service) meant nothing was listening on the advertised port, so the
            # Ingress answered 502.
            - containerPort: 8080
              name: ui
          env:
            # Not 127.0.0.1: the auto-setup server binds the pod IP (10.244.x.y:7233), so
            # a loopback dial is refused and every UI API call answers 503 while the static
            # page still loads. The Service address is what the API and the worker dial too.
            - name: TEMPORAL_ADDRESS
              value: "temporal.optimus.svc:7233"
            - name: TEMPORAL_CORS_ORIGINS
              # The browser origins the UI is reached on: the port-forward, and the
              # Ingress host from the local development environment.
              value: "http://localhost:8080,https://temporal.optimus.local"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
