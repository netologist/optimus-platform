# Minimal deployment manifest for Platform API
# TODO: In production, add HorizontalPodAutoscaler, PodDisruptionBudget, and separate Worker deployment
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: optimus
  labels:
    app.kubernetes.io/name: platform
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: optimus
  labels:
    app.kubernetes.io/name: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform
    spec:
      containers:
        - name: platform
          image: localhost:5001/optimus/platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
