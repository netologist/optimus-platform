apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: optimus
  labels:
    app.kubernetes.io/name: outbox-relay
spec:
  # A single replica keeps event ordering trivial. Scaling out would require the
  # outbox poll to claim rows rather than merely read them.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outbox-relay
    spec:
      containers:
        - name: outbox-relay
          image: localhost:5001/optimus/platform:dev
          imagePullPolicy: Always
          command: ["/app/outbox-relay"]
          env:
            - name: DATABASE_URL
              value: "postgres://optimus:optimus_secret@postgres.optimus.svc:5432/optimus?sslmode=disable"
            - name: REDPANDA_BROKERS
              value: "redpanda.optimus.svc:9092"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "jaeger.optimus.svc:4317"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
