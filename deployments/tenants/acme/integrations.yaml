apiVersion: platform.optimus.dev/v1alpha1
kind: EnterpriseIntegration
metadata:
  name: acme-eam
  namespace: optimus
  labels:
    platform.optimus.dev/tenant: acme
    platform.optimus.dev/system: eam
spec:
  tenant: acme
  systemType: eam
  port: 8080
  capabilities:
    - eam.get_asset
    - eam.get_maintenance_history
